appId: com.sanbluedot.pdfstation
productName: sanblueᵈᵒᵗ pdf-station

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

# Sin firma de Apple (uso personal, no App Store) — al abrir por primera vez:
# clic derecho → Abrir, o Ajustes del Sistema → Privacidad y seguridad → Abrir igualmente
mac:
  identity: null
  icon: resources/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]

dmg:
  title: sanblueᵈᵒᵗ pdf-station

win:
  icon: resources/icon.png
  # Nombre del zip portable (dist:win:zip). Vive aquí y no en el script: las comillas del
  # script se rompían en cmd.exe (simples) o en sh (dobles expanden ${...})
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
  target:
    - target: nsis
      arch: [x64]

nsis:
  # El instalador conserva el nombre por defecto de electron-builder
  artifactName: "${productName} Setup ${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true

npmRebuild: false
